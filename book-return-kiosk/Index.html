<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --blue: #2563eb; --blue-dark: #1d4ed8; --green: #16a34a;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --red: #dc2626; --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }

  /* ── 헤더 ── */
  header {
    background: var(--card); padding: 14px 22px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); z-index: 5;
  }
  header h1 { font-size: 1.25rem; }
  #ctx-chip {
    margin-left: auto; background: #dbeafe; color: var(--blue-dark);
    padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 1rem;
    display: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #steps { display: flex; gap: 6px; }
  .step-dot { width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; }
  .step-dot.on { background: var(--blue); }

  /* ── 화면 공통 ── */
  main { flex: 1; overflow: hidden; position: relative; }
  section.screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 20px; overflow-y: auto;
  }
  section.screen.active { display: flex; }
  .screen h2 { font-size: 1.9rem; text-align: center; }
  .screen p.hint { color: var(--muted); font-size: 1.1rem; text-align: center; }

  .btn {
    border: none; border-radius: var(--radius); cursor: pointer;
    font-size: 1.4rem; font-weight: 700; padding: 22px 36px;
    background: var(--blue); color: #fff; min-width: 220px;
    transition: transform .08s; touch-action: manipulation;
  }
  .btn:active { transform: scale(.97); }
  .btn.secondary { background: #e2e8f0; color: var(--text); }
  .btn.green { background: var(--green); }
  .btn.ghost { background: transparent; color: var(--muted); min-width: 0; padding: 12px 20px; font-size: 1.05rem; }
  .btn.danger { background: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }

  .scan-pulse {
    width: 130px; height: 130px; border-radius: 50%;
    background: #dbeafe; display: flex; align-items: center; justify-content: center;
    font-size: 3.2rem; animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,.35); } 50% { box-shadow: 0 0 0 24px rgba(37,99,235,0); } }

  /* ── 시작 화면 ── */
  #screen-idle .btn { font-size: 2rem; padding: 34px 70px; }

  /* ── 과정 수기 입력 ── */
  #manual-course { display: none; flex-direction: column; gap: 12px; width: min(440px, 92vw); }
  #manual-course input {
    font-size: 1.4rem; padding: 18px; border: 2px solid #cbd5e1; border-radius: 12px; width: 100%;
  }
  #manual-course input:focus { outline: none; border-color: var(--blue); }

  /* ── 방식 선택 카드 ── */
  .mode-cards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .mode-card {
    background: var(--card); border: 3px solid transparent; border-radius: var(--radius);
    width: min(320px, 84vw); padding: 30px 24px; cursor: pointer; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.07); transition: transform .1s;
  }
  .mode-card:active { transform: scale(.97); }
  .mode-card .icon { font-size: 3.4rem; }
  .mode-card h3 { font-size: 1.5rem; margin: 12px 0 8px; }
  .mode-card p { color: var(--muted); font-size: 1.02rem; line-height: 1.45; }

  /* ── 도서 스캔 화면 ── */
  #screen-books { justify-content: flex-start; padding-top: 18px; }
  #book-scan-bar {
    display: flex; align-items: center; gap: 14px; width: min(860px, 96vw);
    background: var(--card); border-radius: var(--radius); padding: 16px 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
  }
  #book-scan-bar .pulse-mini {
    width: 54px; height: 54px; border-radius: 50%; background: #dbeafe; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
    animation: pulse 1.6s infinite;
  }
  #book-scan-bar .label { font-size: 1.15rem; font-weight: 700; }
  #book-scan-bar .sub { color: var(--muted); font-size: .95rem; }
  #cart {
    width: min(860px, 96vw); flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px;
  }
  .cart-item {
    background: var(--card); border-radius: 14px; padding: 14px 18px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.05);
  }
  .cart-item.flash { animation: flash .5s; }
  @keyframes flash { 0% { background: #dcfce7; } 100% { background: var(--card); } }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .title { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-item .isbn { color: var(--muted); font-size: .9rem; }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-ctrl button {
    width: 52px; height: 52px; border-radius: 12px; border: none; background: #e2e8f0;
    font-size: 1.6rem; font-weight: 800; cursor: pointer;
  }
  .qty-ctrl .qty {
    min-width: 64px; text-align: center; font-size: 1.5rem; font-weight: 800;
    cursor: pointer; padding: 4px; border-radius: 8px;
  }
  .qty-ctrl .qty:active { background: #eff6ff; }
  .cart-item .del { width: 48px; height: 48px; border: none; border-radius: 12px; background: #fee2e2; color: var(--red); font-size: 1.3rem; cursor: pointer; }
  .badge-unreg {
    display: inline-block; background: #fee2e2; color: var(--red);
    font-size: .82rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; vertical-align: middle;
  }
  #books-footer {
    width: min(860px, 96vw); display: flex; gap: 14px; align-items: center; padding: 8px 0 4px;
  }
  #books-footer .total { font-size: 1.25rem; font-weight: 800; flex: 1; }
  #cart-empty { color: var(--muted); text-align: center; font-size: 1.1rem; padding: 36px 0; }

  /* ── 확인 화면 ── */
  #confirm-box {
    background: var(--card); border-radius: var(--radius); width: min(760px, 94vw);
    padding: 26px; box-shadow: 0 4px 14px rgba(0,0,0,.07); max-height: 52vh; overflow-y: auto;
  }
  #confirm-box table { width: 100%; border-collapse: collapse; font-size: 1.1rem; }
  #confirm-box th, #confirm-box td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
  #confirm-box th { color: var(--muted); font-size: .95rem; }
  #confirm-box td.num { text-align: right; font-weight: 700; }

  /* ── 완료 화면 ── */
  #screen-done .check {
    width: 150px; height: 150px; border-radius: 50%; background: #dcfce7;
    display: flex; align-items: center; justify-content: center; font-size: 4.5rem; color: var(--green);
  }

  /* ── 모달 공통 ── */
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,.65); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--card); border-radius: var(--radius); padding: 22px;
    width: min(520px, 96vw); display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  .modal-card h3 { font-size: 1.4rem; text-align: center; }

  /* 카메라 */
  #qr-reader { width: min(440px, 88vw); border-radius: 12px; overflow: hidden; }

  /* 숫자 키패드 */
  #qty-display {
    font-size: 2.6rem; font-weight: 800; background: var(--bg);
    border-radius: 12px; padding: 12px 28px; min-width: 200px; text-align: center;
  }
  #keypad { display: grid; grid-template-columns: repeat(3, 96px); gap: 10px; }
  #keypad button {
    height: 78px; border: none; border-radius: 14px; background: #e2e8f0;
    font-size: 1.8rem; font-weight: 700; cursor: pointer;
  }
  #keypad button:active { background: #cbd5e1; }
  #qty-book-title { color: var(--muted); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 16px 28px; border-radius: 999px;
    font-size: 1.15rem; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 99; max-width: 92vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--red); }

  /* 로딩 */
  #loading {
    position: fixed; inset: 0; background: rgba(241,245,249,.7); z-index: 80;
    display: none; align-items: center; justify-content: center;
  }
  #loading.open { display: flex; }
  .spinner {
    width: 64px; height: 64px; border: 7px solid #cbd5e1; border-top-color: var(--blue);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>📚 도서 반품</h1>
  <div id="steps">
    <div class="step-dot" data-step="1"></div>
    <div class="step-dot" data-step="2"></div>
    <div class="step-dot" data-step="3"></div>
    <div class="step-dot" data-step="4"></div>
  </div>
  <div id="ctx-chip"></div>
</header>

<main>
  <!-- 0. 대기 화면 -->
  <section id="screen-idle" class="screen active">
    <div class="scan-pulse">📦</div>
    <h2>도서 반품 키오스크</h2>
    <p class="hint">화면을 눌러 반품을 시작하세요</p>
    <button class="btn" onclick="startSession()">반품 시작하기</button>
  </section>

  <!-- 1. 연수과정 QR 스캔 -->
  <section id="screen-course" class="screen">
    <div class="scan-pulse">🔳</div>
    <h2>연수 과정 QR코드를 스캔하세요</h2>
    <p class="hint">USB 스캐너로 QR을 찍거나, 카메라 스캔을 이용하세요</p>
    <button class="btn secondary" onclick="openCamera('course')">📷 카메라로 스캔</button>
    <button class="btn ghost" onclick="toggleManualCourse()">직접 입력하기</button>
    <div id="manual-course">
      <input id="in-course" type="text" placeholder="연수 과정명">
      <input id="in-cohort" type="text" placeholder="기수 (예: 12기)">
      <button class="btn" onclick="confirmManualCourse()">확인</button>
    </div>
    <button class="btn ghost" onclick="resetAll()">← 처음으로</button>
  </section>

  <!-- 2. 권수 입력 방식 선택 -->
  <section id="screen-mode" class="screen">
    <h2>권수 입력 방식을 선택하세요</h2>
    <div class="mode-cards">
      <div class="mode-card" onclick="chooseMode('manual')">
        <div class="icon">🔢</div>
        <h3>권수 직접 입력</h3>
        <p>도서를 한 번 스캔한 뒤<br>화면 키패드로 권수를 입력합니다</p>
      </div>
      <div class="mode-card" onclick="chooseMode('scan')">
        <div class="icon">📖</div>
        <h3>바코드 반복 스캔</h3>
        <p>반품할 도서를 한 권씩 스캔하면<br>권수가 자동으로 누적됩니다</p>
      </div>
    </div>
    <button class="btn ghost" onclick="goCourse()">← 이전</button>
  </section>

  <!-- 3. 도서 스캔 -->
  <section id="screen-books" class="screen">
    <div id="book-scan-bar">
      <div class="pulse-mini">📕</div>
      <div style="flex:1; min-width:0;">
        <div class="label">도서 뒷면의 ISBN 바코드를 스캔하세요</div>
        <div class="sub" id="mode-hint"></div>
      </div>
      <button class="btn secondary" style="min-width:0; padding:14px 18px; font-size:1.05rem;" onclick="openCamera('book')">📷 카메라</button>
    </div>
    <div id="cart"><div id="cart-empty">아직 스캔한 도서가 없습니다</div></div>
    <div id="books-footer">
      <button class="btn ghost" onclick="goMode()">← 이전</button>
      <div class="total" id="cart-total"></div>
      <button class="btn green" id="btn-to-confirm" onclick="goConfirm()" disabled>반품 확인 →</button>
    </div>
  </section>

  <!-- 4. 확인 -->
  <section id="screen-confirm" class="screen">
    <h2>반품 내역을 확인해주세요</h2>
    <div id="confirm-box"></div>
    <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;">
      <button class="btn secondary" onclick="goBooks()">← 수정하기</button>
      <button class="btn green" onclick="submit()">✓ 반품 제출</button>
    </div>
  </section>

  <!-- 5. 완료 -->
  <section id="screen-done" class="screen">
    <div class="check">✓</div>
    <h2>반품이 완료되었습니다!</h2>
    <p class="hint" id="done-msg"></p>
    <p class="hint" id="done-count"></p>
    <button class="btn" onclick="resetAll()">처음으로</button>
  </section>
</main>

<!-- 카메라 모달 -->
<div class="modal" id="camera-modal">
  <div class="modal-card">
    <h3 id="camera-title">스캔</h3>
    <div id="qr-reader"></div>
    <button class="btn secondary" onclick="closeCamera()">닫기</button>
  </div>
</div>

<!-- 권수 키패드 모달 -->
<div class="modal" id="qty-modal">
  <div class="modal-card">
    <h3>반품 권수 입력</h3>
    <div id="qty-book-title"></div>
    <div id="qty-display">1</div>
    <div id="keypad">
      <button onclick="kp('1')">1</button><button onclick="kp('2')">2</button><button onclick="kp('3')">3</button>
      <button onclick="kp('4')">4</button><button onclick="kp('5')">5</button><button onclick="kp('6')">6</button>
      <button onclick="kp('7')">7</button><button onclick="kp('8')">8</button><button onclick="kp('9')">9</button>
      <button onclick="kp('C')">C</button><button onclick="kp('0')">0</button><button onclick="kp('⌫')">⌫</button>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="btn secondary" onclick="closeQty()">취소</button>
      <button class="btn" onclick="confirmQty()">확인</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spinner"></div></div>
<div id="toast"></div>

<script>
/* ───────────────────────── 상태 ───────────────────────── */
var state = {
  screen: 'idle',
  course: '', cohort: '', qrRaw: '',
  mode: '',                 // 'manual' | 'scan'
  cart: []                  // [{isbn, title, edition, qty, found}] — found=false면 미등록반품 시트로 기록
};
var bookCache = {};         // isbn -> {found,isbn,title,...}
var pendingBook = null;     // 키패드 입력 대상
var qtyValue = '1';

var SCREEN_STEP = { idle: 0, course: 1, mode: 2, books: 3, confirm: 4, done: 4 };

/* ───────────────────────── 화면 전환 ───────────────────────── */
function show(name) {
  state.screen = name;
  document.querySelectorAll('section.screen').forEach(function (s) {
    s.classList.toggle('active', s.id === 'screen-' + name);
  });
  var step = SCREEN_STEP[name] || 0;
  document.querySelectorAll('.step-dot').forEach(function (d) {
    d.classList.toggle('on', Number(d.dataset.step) <= step);
  });
  var chip = document.getElementById('ctx-chip');
  if (state.course && name !== 'idle' && name !== 'course') {
    chip.textContent = state.course + (state.cohort ? ' · ' + state.cohort : '');
    chip.style.display = 'block';
  } else {
    chip.style.display = 'none';
  }
}

function startSession() { show('course'); }
function goCourse() { show('course'); }
function goMode() { show('mode'); }
function goBooks() {
  document.getElementById('mode-hint').textContent =
    state.mode === 'scan'
      ? '반복 스캔 모드: 같은 도서를 스캔할 때마다 권수가 1씩 늘어납니다'
      : '직접 입력 모드: 스캔 후 키패드로 권수를 입력합니다';
  renderCart();
  show('books');
}

function resetAll() {
  closeCamera();
  closeQty();
  state.course = ''; state.cohort = ''; state.qrRaw = ''; state.mode = ''; state.cart = [];
  document.getElementById('in-course').value = '';
  document.getElementById('in-cohort').value = '';
  document.getElementById('manual-course').style.display = 'none';
  show('idle');
}

/* ───────────────────── 1. 연수과정 QR ───────────────────── */
function toggleManualCourse() {
  var el = document.getElementById('manual-course');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
  if (el.style.display === 'flex') document.getElementById('in-course').focus();
}

function confirmManualCourse() {
  var c = document.getElementById('in-course').value.trim();
  var g = document.getElementById('in-cohort').value.trim();
  if (!c) { toast('연수 과정명을 입력해주세요', true); return; }
  state.course = c; state.cohort = g; state.qrRaw = '';
  beep();
  show('mode');
}

/**
 * QR 내용 해석. 지원 형식:
 *  - JSON: {"course":"...","cohort":"..."} 또는 {"과정":"...","기수":"..."}
 *  - 구분자: "과정명|기수", "과정명,기수" (탭/세미콜론/줄바꿈도 허용)
 *  - 그 외: 전체를 과정명으로 보고 직접 입력 폼에 채워 확인 요청
 */
function handleCourseQr(text) {
  text = String(text).trim();
  var course = '', cohort = '';
  try {
    var j = JSON.parse(text);
    course = j.course || j['과정'] || j['연수과정'] || '';
    cohort = j.cohort || j['기수'] || '';
  } catch (e) { /* JSON 아님 */ }
  if (!course) {
    var parts = text.split(/[|,;\t\n]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (parts.length >= 2) { course = parts[0]; cohort = parts[1]; }
    else if (parts.length === 1) { course = parts[0]; }
  }
  if (!course) { toast('QR 내용을 해석할 수 없습니다', true); return; }

  state.qrRaw = text;
  if (cohort) {
    state.course = course; state.cohort = cohort;
    beep();
    toast('✓ ' + course + ' ' + cohort);
    show('mode');
  } else {
    // 기수가 없으면 수기 폼에 채워서 확인받기
    document.getElementById('in-course').value = course;
    document.getElementById('manual-course').style.display = 'flex';
    document.getElementById('in-cohort').focus();
    toast('기수를 입력한 뒤 확인을 눌러주세요');
  }
}

/* ───────────────────── 2. 방식 선택 ───────────────────── */
function chooseMode(m) { state.mode = m; beep(); goBooks(); }

/* ───────────────────── 3. 도서 스캔 ───────────────────── */
function normalizeIsbn(raw) {
  return String(raw || '').toUpperCase().replace(/[^0-9X]/g, '');
}
function isValidIsbn(s) {
  if (s.length === 13) return /^97[89]\d{10}$/.test(s);
  if (s.length === 10) return /^\d{9}[0-9X]$/.test(s);
  return false;
}

function handleIsbnScan(text) {
  var isbn = normalizeIsbn(text);
  if (!isValidIsbn(isbn)) {
    toast('도서 바코드(ISBN)가 아닙니다: ' + text, true);
    return;
  }
  if (bookCache[isbn]) { onBookResolved(bookCache[isbn]); return; }
  showLoading(true);
  google.script.run
    .withSuccessHandler(function (book) {
      showLoading(false);
      bookCache[isbn] = book;
      onBookResolved(book);
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      toast('도서 조회 실패: ' + err.message, true);
    })
    .getBookByIsbn(isbn);
}

function onBookResolved(book) {
  var title = book.found ? book.title : '미등록 도서';
  var edition = book.found ? (book.edition || '') : '';
  if (!book.found) {
    toast('도서목록에 없는 도서입니다 — 미등록반품으로 기록됩니다', true);
  }
  if (state.mode === 'scan') {
    addToCart(book.isbn, title, edition, 1, true, book.found);
    beep();
  } else {
    pendingBook = { isbn: book.isbn, title: title, edition: edition, found: book.found };
    var existing = findCartItem(book.isbn);
    openQty(existing ? String(existing.qty) : '1');
    beep();
  }
}

function findCartItem(isbn) {
  for (var i = 0; i < state.cart.length; i++) if (state.cart[i].isbn === isbn) return state.cart[i];
  return null;
}

/** accumulate=true면 기존 수량에 더하고, false면 수량을 교체 */
function addToCart(isbn, title, edition, qty, accumulate, found) {
  var item = findCartItem(isbn);
  if (item) item.qty = accumulate ? item.qty + qty : qty;
  else { item = { isbn: isbn, title: title, edition: edition, qty: qty, found: !!found }; state.cart.push(item); }
  renderCart(isbn);
  toast('✓ ' + title + (edition ? ' (' + edition + ')' : '') + ' — ' + item.qty + '권');
}

function changeQty(isbn, delta) {
  var item = findCartItem(isbn);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCart();
}
function removeItem(isbn) {
  state.cart = state.cart.filter(function (it) { return it.isbn !== isbn; });
  renderCart();
}
function editQty(isbn) {
  var item = findCartItem(isbn);
  if (!item) return;
  pendingBook = { isbn: item.isbn, title: item.title, edition: item.edition, found: item.found };
  openQty(String(item.qty));
}

function totalQty() {
  return state.cart.reduce(function (s, it) { return s + it.qty; }, 0);
}

function renderCart(flashIsbn) {
  var cart = document.getElementById('cart');
  if (!state.cart.length) {
    cart.innerHTML = '<div id="cart-empty">아직 스캔한 도서가 없습니다</div>';
  } else {
    cart.innerHTML = state.cart.map(function (it) {
      return '<div class="cart-item' + (it.isbn === flashIsbn ? ' flash' : '') + '">' +
        '<div class="info"><div class="title">' +
        (it.found ? '' : '<span class="badge-unreg">미등록</span> ') + esc(it.title) +
        (it.edition ? ' <span style="color:var(--muted);font-size:.95rem;font-weight:600;">' + esc(it.edition) + '</span>' : '') + '</div>' +
        '<div class="isbn">ISBN ' + it.isbn + (it.found ? '' : ' · 미등록반품 시트에 기록됩니다') + '</div></div>' +
        '<div class="qty-ctrl">' +
          '<button onclick="changeQty(\'' + it.isbn + '\',-1)">−</button>' +
          '<div class="qty" onclick="editQty(\'' + it.isbn + '\')">' + it.qty + '권</div>' +
          '<button onclick="changeQty(\'' + it.isbn + '\',1)">＋</button>' +
        '</div>' +
        '<button class="del" onclick="removeItem(\'' + it.isbn + '\')">✕</button>' +
        '</div>';
    }).join('');
  }
  document.getElementById('cart-total').textContent =
    state.cart.length ? '총 ' + state.cart.length + '종 ' + totalQty() + '권' : '';
  document.getElementById('btn-to-confirm').disabled = !state.cart.length;
}

/* ───────────────────── 4. 확인 / 제출 ───────────────────── */
function goConfirm() {
  if (!state.cart.length) return;
  var unregCount = state.cart.filter(function (it) { return !it.found; }).length;
  var html = '<table><tr><th>제목</th><th>판정보</th><th>ISBN</th><th style="text-align:right">권수</th></tr>' +
    state.cart.map(function (it) {
      return '<tr><td>' + (it.found ? '' : '<span class="badge-unreg">미등록</span> ') + esc(it.title) +
        '</td><td>' + esc(it.edition || '-') + '</td><td>' + it.isbn + '</td><td class="num">' + it.qty + '</td></tr>';
    }).join('') +
    '<tr><td colspan="3" style="font-weight:800">합계</td><td class="num">' + totalQty() + '</td></tr></table>' +
    (unregCount
      ? '<p style="margin-top:12px;color:var(--red);font-weight:700;">⚠ 미등록 도서 ' + unregCount + '종은 "미등록반품" 시트에 따로 기록됩니다</p>'
      : '');
  document.getElementById('confirm-box').innerHTML = html;
  show('confirm');
}

function submit() {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      document.getElementById('done-msg').textContent =
        state.course + (state.cohort ? ' · ' + state.cohort : '');
      document.getElementById('done-count').textContent =
        '총 ' + totalQty() + '권의 반품이 기록되었습니다' +
        (res.unregistered ? ' (미등록 도서 ' + res.unregistered + '종은 미등록반품 시트에 기록)' : '');
      show('done');
      // 키오스크 자동 초기화
      setTimeout(function () { if (state.screen === 'done') resetAll(); }, 8000);
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      toast('제출 실패: ' + err.message + ' — 다시 시도해주세요', true);
    })
    .submitReturn({
      course: state.course, cohort: state.cohort, qrRaw: state.qrRaw,
      mode: state.mode, items: state.cart
    });
}

/* ───────────────── USB/블루투스 스캐너 (키보드 웨지) ───────────────── */
var wedgeBuf = '', wedgeLast = 0;
document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // 수기 입력 중에는 무시
  var now = Date.now();
  if (now - wedgeLast > 300) wedgeBuf = '';            // 사람 타이핑과 구분
  wedgeLast = now;
  if (e.key === 'Enter') {
    if (wedgeBuf.length >= 4) dispatchScan(wedgeBuf);
    wedgeBuf = '';
  } else if (e.key.length === 1) {
    wedgeBuf += e.key;
  }
});

function dispatchScan(text) {
  if (document.getElementById('qty-modal').classList.contains('open')) return;
  if (state.screen === 'course') handleCourseQr(text);
  else if (state.screen === 'books') handleIsbnScan(text);
  else if (state.screen === 'idle') { show('course'); handleCourseQr(text); }
}

/* ───────────────────── 카메라 스캔 ───────────────────── */
var html5Qr = null, camTarget = '', lastCamText = '', lastCamTime = 0;

function openCamera(target) {
  camTarget = target;
  document.getElementById('camera-title').textContent =
    target === 'course' ? '연수 과정 QR을 비춰주세요' : 'ISBN 바코드를 비춰주세요';
  document.getElementById('camera-modal').classList.add('open');
  var formats = target === 'course'
    ? [Html5QrcodeSupportedFormats.QR_CODE]
    : [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128];
  html5Qr = new Html5Qrcode('qr-reader', { formatsToSupport: formats });
  html5Qr.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 300, height: target === 'course' ? 300 : 160 } },
    onCameraScan,
    function () { /* 프레임 단위 인식 실패는 무시 */ }
  ).catch(function (err) {
    toast('카메라를 열 수 없습니다. 브라우저 카메라 권한을 확인해주세요.', true);
    closeCamera();
  });
}

function onCameraScan(text) {
  var now = Date.now();
  if (text === lastCamText && now - lastCamTime < 1800) return;  // 중복 인식 방지
  lastCamText = text; lastCamTime = now;
  if (camTarget === 'course') {
    closeCamera();
    handleCourseQr(text);
  } else {
    // 도서 스캔은 카메라를 켜둔 채 연속 스캔 허용
    handleIsbnScan(text);
  }
}

function closeCamera() {
  document.getElementById('camera-modal').classList.remove('open');
  if (html5Qr) {
    var inst = html5Qr; html5Qr = null;
    inst.stop().then(function () { inst.clear(); }).catch(function () {});
  }
}

/* ───────────────────── 권수 키패드 ───────────────────── */
function openQty(initial) {
  qtyValue = initial || '1';
  document.getElementById('qty-book-title').textContent =
    pendingBook ? pendingBook.title + (pendingBook.edition ? ' (' + pendingBook.edition + ')' : '') : '';
  document.getElementById('qty-display').textContent = qtyValue;
  document.getElementById('qty-modal').classList.add('open');
}
function closeQty() {
  document.getElementById('qty-modal').classList.remove('open');
  pendingBook = null;
}
function kp(k) {
  if (k === 'C') qtyValue = '';
  else if (k === '⌫') qtyValue = qtyValue.slice(0, -1);
  else if (qtyValue.length < 4) qtyValue = (qtyValue === '0' ? '' : qtyValue) + k;
  document.getElementById('qty-display').textContent = qtyValue || '0';
}
function confirmQty() {
  var n = parseInt(qtyValue, 10);
  if (!n || n < 1) { toast('1권 이상 입력해주세요', true); return; }
  if (pendingBook) addToCart(pendingBook.isbn, pendingBook.title, pendingBook.edition, n, false, pendingBook.found);
  closeQty();
}

/* ───────────────────── 공통 유틸 ───────────────────── */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var toastTimer = null;
function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 2600);
}
function showLoading(on) {
  document.getElementById('loading').classList.toggle('open', on);
}
var audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 1200; g.gain.value = 0.08;
    o.start(); o.stop(audioCtx.currentTime + 0.12);
  } catch (e) { /* 소리 미지원 환경 */ }
}
</script>
